[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strix-pydantic"
version = "0.1.0"
description = "Strix non-interactive orchestrator using Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2.0",
    "pydantic-ai[bedrock]>=2.0,<3",
    "pydantic>=2.14.1",
    "httpx>=0.27.0",
    "click>=8.5.0",
    "python-dotenv>=1.2.4",
    "defusedxml>=0.7.1",
    "textual>=8.2.8",
    "rich>=15.0.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "logfire>=5.1.1",
]

[project.scripts]
strix-pydantic = "strix_pydantic.interface.cli:scan"
strix-service = "strix_pydantic.service.backend:app"
strix-client = "strix_pydantic.service.cli_client:main"
strix-tui = "strix_pydantic.service.tui_client:main"
strix-tui-standalone = "strix_pydantic.service.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
ui = [
    "textual>=8.2.8",
    "rich>=15.0.0",
]
service = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["strix_pydantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "SIM115"]
